name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt

      - name: Dependency conflict check
        run: pip check

      - name: Syntax check
        run: python -m py_compile bot.py database.py config.py security.py railway_client.py

      - name: Run tests
        run: pytest -q

      - name: Dependency vulnerability scan (non-blocking)
        # Ma'lum zaifliklarni ko'rsatib beradi, lekin CI'ni to'xtatmaydi —
        # yangi/tasdiqlanmagan CVE bazasi noiz-false-positive bilan build'ni
        # asossiz qizil qilib qo'ymasligi uchun.
        continue-on-error: true
        run: |
          pip install --quiet pip-audit
          pip-audit -r requirements.txt
